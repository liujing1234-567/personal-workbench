<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="创作工作台" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
  <title>创作工作台</title>
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="菜单">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/>
      </svg>
    </button>
    <h1 id="pageTitle" class="topbar-title">每日计划</h1>
    <div class="topbar-right"></div>
  </header>

  <!-- 侧边抽屉菜单 -->
  <aside id="drawer" class="drawer">
    <div class="drawer-mask" id="drawerMask"></div>
    <nav class="drawer-panel">
      <div class="drawer-header">
        <h2 class="drawer-name">个人工作台</h2>
        <p class="drawer-sub">自媒体创作者专用</p>
      </div>
      <ul class="drawer-menu" id="drawerMenu">
        <li data-page="tasks" class="menu-item active">
          <span class="menu-icon">📋</span>
          <span class="menu-text">每日计划</span>
        </li>
        <li data-page="topics" class="menu-item">
          <span class="menu-icon">💡</span>
          <span class="menu-text">选题池</span>
        </li>
        <li data-page="inspiration" class="menu-item">
          <span class="menu-icon">🔥</span>
          <span class="menu-text">灵感记录</span>
        </li>
        <li data-page="finance" class="menu-item">
          <span class="menu-icon">💰</span>
          <span class="menu-text">小富婆金库收入</span>
        </li>
        <li data-page="publish" class="menu-item">
          <span class="menu-icon">📅</span>
          <span class="menu-text">发布更新</span>
        </li>
        <li data-page="settings" class="menu-item">
          <span class="menu-icon">⚙️</span>
          <span class="menu-text">设置</span>
        </li>
      </ul>
      <div class="drawer-footer">
        <p class="status-line">状态：<span id="userStatus">复更中</span></p>
        <p class="status-line">每日灵感自动 <span class="status-time">09:00</span></p>
      </div>
    </nav>
  </aside>

  <!-- 主内容区 -->
  <main id="app" class="app-main">
    <!-- 各页面将动态渲染到这里 -->
  </main>

  <!-- Toast 提示 -->
  <div id="toast" class="toast"></div>

  <!-- 脚本 -->
  <script src="data/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/topics.js"></script>
  <script src="js/inspiration.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/publish.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
